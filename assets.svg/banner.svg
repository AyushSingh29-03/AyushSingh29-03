<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde2ea"/>
      <stop offset="50%" stop-color="#e6ecfd"/>
      <stop offset="100%" stop-color="#ece2fd"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9b6f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c9b6f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a9c7fb" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a9c7fb" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#7c6bb0" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="panelStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <circle cx="150" cy="60" r="160" fill="url(#blob1)" filter="url(#blur1)"/>
  <circle cx="1080" cy="250" r="180" fill="url(#blob2)" filter="url(#blur1)"/>
  <circle cx="950" cy="50" r="90" fill="url(#blob1)" filter="url(#blur1)"/>

  <!-- orbit motif -->
  <g transform="translate(140,150)" opacity="0.55">
    <ellipse cx="0" cy="0" rx="70" ry="26" fill="none" stroke="#8b7fd6" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="70" ry="26" fill="none" stroke="#8b7fd6" stroke-width="1.5" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="70" ry="26" fill="none" stroke="#8b7fd6" stroke-width="1.5" transform="rotate(120)"/>
    <circle cx="0" cy="0" r="7" fill="#8b7fd6"/>
  </g>
  <g transform="translate(1040,150)" opacity="0.55">
    <ellipse cx="0" cy="0" rx="70" ry="26" fill="none" stroke="#7f9fe0" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="70" ry="26" fill="none" stroke="#7f9fe0" stroke-width="1.5" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="70" ry="26" fill="none" stroke="#7f9fe0" stroke-width="1.5" transform="rotate(120)"/>
    <circle cx="0" cy="0" r="7" fill="#7f9fe0"/>
  </g>

  <!-- glass panel -->
  <rect x="260" y="70" width="680" height="160" rx="28" fill="#ffffff" fill-opacity="0.38" stroke="url(#panelStroke)" stroke-width="1.5" filter="url(#softShadow)"/>

  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#3b3b58">Ayush Singh</text>
  <text x="600" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#5b5b82">B.Tech Computer Engineering (AI) Student</text>
</svg>
