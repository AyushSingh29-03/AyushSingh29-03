<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde2ea"/>
      <stop offset="100%" stop-color="#e6ecfd"/>
    </linearGradient>
    <filter id="s" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#7c6bb0" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="260" rx="30" fill="url(#bg)" fill-opacity="0.5"/>
  <rect x="10" y="10" width="1180" height="240" rx="24" fill="#ffffff" fill-opacity="0.4" stroke="#ffffff" stroke-width="1.5" filter="url(#s)"/>

  <!-- 4 columns -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- Languages -->
    <circle cx="70" cy="55" r="8" fill="#8b7fd6"/>
    <text x="90" y="61" font-size="19" font-weight="700" fill="#3b3b58">Languages</text>
    <text x="70" y="95" font-size="15" fill="#5b5b82">C  ·  Java  ·  Python</text>
    <text x="70" y="118" font-size="15" fill="#5b5b82">PHP  ·  SQL</text>
    <text x="70" y="141" font-size="15" fill="#5b5b82">HTML  ·  CSS  ·  JS</text>

    <!-- AI / CV -->
    <circle cx="370" cy="55" r="8" fill="#7f9fe0"/>
    <text x="390" y="61" font-size="19" font-weight="700" fill="#3b3b58">AI / CV</text>
    <text x="370" y="95" font-size="15" fill="#5b5b82">Prompt Engineering</text>
    <text x="370" y="118" font-size="15" fill="#5b5b82">Generative AI</text>
    <text x="370" y="141" font-size="15" fill="#5b5b82">OpenCV  ·  MediaPipe</text>

    <!-- Tools -->
    <circle cx="670" cy="55" r="8" fill="#e2a9d8"/>
    <text x="690" y="61" font-size="19" font-weight="700" fill="#3b3b58">Tools &amp; Platforms</text>
    <text x="670" y="95" font-size="15" fill="#5b5b82">Git  ·  GitHub  ·  VS Code</text>
    <text x="670" y="118" font-size="15" fill="#5b5b82">MySQL  ·  Oracle  ·  Docker</text>
    <text x="670" y="141" font-size="15" fill="#5b5b82">Jupyter  ·  Colab</text>

    <!-- Concepts -->
    <circle cx="970" cy="55" r="8" fill="#a9c7fb"/>
    <text x="990" y="61" font-size="19" font-weight="700" fill="#3b3b58">Concepts</text>
    <text x="970" y="95" font-size="15" fill="#5b5b82">DSA  ·  OOP</text>
    <text x="970" y="118" font-size="15" fill="#5b5b82">DBMS</text>
    <text x="970" y="141" font-size="15" fill="#5b5b82">Software Development</text>
  </g>

  <line x1="290" y1="40" x2="290" y2="180" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <line x1="590" y1="40" x2="590" y2="180" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <line x1="890" y1="40" x2="890" y2="180" stroke="#ffffff" stroke-width="2" opacity="0.6"/>

  <text x="70" y="210" font-size="14" fill="#8a8ab0" font-style="italic">Design &amp; creative: Figma · Canva · CapCut</text>
</svg>
