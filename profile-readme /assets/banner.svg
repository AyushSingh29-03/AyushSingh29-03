  <text x="72" y="244" font-family="'DM Sans','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#F4F1E8" fill-opacity="0.65" letter-spacing="2">B.TECH CE (AI)  ·  BUILDER  ·  GANPAT UNIVERSITY</text>
