<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Ayush Singh - Curiosity, compiled." xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1200" height="300" fill="#0E2A1A"/>

  <!-- pitch markings -->
